INHERIT: mkdocs.base.yml
site_description: API evidence for Robot Framework, one HTML per case
site_url: https://angel-valdezzz.github.io/robotframework-request-reporter/
docs_dir: docs/en
site_dir: site
edit_uri: edit/main/docs/en/
theme:
  language: en
  palette:
  - scheme: default
    primary: custom
    accent: teal
    toggle:
      icon: material/weather-night
      name: Dark mode
  - scheme: slate
    primary: custom
    accent: teal
    toggle:
      icon: material/weather-sunny
      name: Light mode
plugins:
  - search:
      lang: en
nav:
  - Home: index.md
  - User guide:
      - Installation: installation.md
      - First case and multiple requests: usage.md
      - DataDriver cases: datadriver.md
      - Configuration: configuration.md
      - Reading the report: report.md
      - Troubleshooting: troubleshooting.md
  - Keyword reference: keywords/index.html
  - Development and publishing: development.md
  - Visual examples: examples/report.html
