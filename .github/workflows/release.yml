name: Publish distribution
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check version change on main
        if: github.event_name == 'push'
        id: version
        run: |
          python - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          current = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          previous = tomllib.loads(subprocess.check_output(
              ['git', 'show', 'HEAD^:pyproject.toml'], text=True
          ))['project']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish={str(current != previous).lower()}\n')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v$(poetry version -s)"
          git merge-base --is-ancestor HEAD origin/main
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy src
      - run: poetry run python scripts/verify.py
      - run: poetry build
      - run: poetry run twine check dist/*
      - run: poetry run python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
  publish:
    if: (github.event_name == 'push' && needs.build.outputs.publish == 'true') || (github.event_name == 'release' && !github.event.release.prerelease)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/robotframework-request-reporter
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
