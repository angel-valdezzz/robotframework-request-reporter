name: Quality and WHL
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run python scripts/verify.py
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry check --lock
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run robocop check tests
      - run: poetry run robocop format --check tests
      - run: poetry run mypy src
      - run: poetry run python scripts/verify.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --prefix build/ui-check jsdom@26.1.0 --no-audit --no-fund
      - run: NODE_PATH="$PWD/build/ui-check/node_modules" node scripts/verify_ui.cjs
      - run: poetry run python docs/scripts/build_site.py
      - name: Set up Node for Libdoc UI verification
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify native bilingual Libdoc menu
        run: |
          npm install --prefix build/libdoc-ui jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH="$PWD/build/libdoc-ui/node_modules" node docs/scripts/verify_libdoc_ui.cjs keywords/index.html
          NODE_PATH="$PWD/build/libdoc-ui/node_modules" node docs/scripts/verify_navigation.cjs
      - run: poetry build
      - run: poetry run twine check dist/*
      - run: poetry run python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-acceptance-results
          path: results/acceptance/
