site_name: Request Reporter
site_description: Evidencia API de Robot Framework, un HTML por caso
site_url: https://angel-valdezzz.github.io/robotframework-request-reporter/
repo_url: https://github.com/angel-valdezzz/robotframework-request-reporter
repo_name: RequestReporter
copyright: Robot Framework Request Reporter · Robot Framework API evidence
extra_javascript:
  - assets/mermaid.min.js
  - assets/landing.js
  - assets/keyword-links.js
extra_css:
  - assets/stylesheets/landing.css
  - assets/stylesheets/standard.css
  - assets/stylesheets/extra.css
  - assets/stylesheets/visual.css
theme:
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  custom_dir: docs/overrides
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.tracking
    - navigation.path
    - toc.follow
    - content.code.select
    - content.tooltips
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo claro
plugins:
  - search
markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - tables
  - abbr
  - footnotes
  - pymdownx.snippets
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/angel-valdezzz/robotframework-request-reporter
      name: Request Reporter on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/robotframework-request-reporter/
      name: Request Reporter on PyPI
  alternate:
    - name: English
      link: https://angel-valdezzz.github.io/robotframework-request-reporter/
      lang: en
    - name: Español
      link: https://angel-valdezzz.github.io/robotframework-request-reporter/es/
      lang: es
