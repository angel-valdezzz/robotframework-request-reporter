INHERIT: base.yml
site_description: Evidencia API de Robot Framework, un HTML por caso
site_url: https://angel-valdezzz.github.io/robotframework-request-reporter/es/
docs_dir: ../es
site_dir: ../../build/site-es
edit_uri: edit/main/docs/es/
theme:
  custom_dir: ../overrides
  language: es
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Modo oscuro
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Modo claro
plugins:
  - search:
      lang: es
  - tags
  - social:
      cards_layout_options:
        background_color: "#101629"
        color: "#eef2ff"
        font_family: DejaVu Sans
  - privacy:
      assets_exclude:
        - unpkg.com/mermaid@11/*
nav:
  - Inicio: index.md
  - Explorar por tema: topics.md
  - Manual de usuario:
      - Instalación: installation.md
      - Primer caso y varios requests: usage.md
      - Casos con DataDriver: datadriver.md
      - Configuración: configuration.md
      - Leer el reporte: report.md
      - Solución de problemas: troubleshooting.md
  - Referencia de keywords: keywords/index.html
  - Desarrollo y publicación: development.md
  - Ejemplos visuales: examples/report.html
