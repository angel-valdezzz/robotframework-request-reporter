[project]
name = "robotframework-request-reporter"
version = "0.5.1"
description = "Standalone HTML API evidence reports for each Robot Framework test case."
authors = [{name = "Angel Molina"}]
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = ["robotframework>=7.5,<8", "requests>=2.32,<3", "jinja2>=3.1.6,<4"]
keywords = ["robotframework", "api", "report", "requests"]
classifiers = ["Framework :: Robot Framework :: Library", "Programming Language :: Python :: 3", "Development Status :: 3 - Alpha"]

[project.urls]
Repository = "https://github.com/angel-valdezzz/robotframework-request-reporter"
Documentation = "https://angel-valdezzz.github.io/robotframework-request-reporter/"

[tool.poetry]
packages = [{include = "request_reporter", from = "src"}, {include = "RequestReporter.py", from = "src"}, {include = "APICaseReporter", from = "src"}]
include = [{path = "src/request_reporter/templates/*.html", format = ["sdist", "wheel"]}, {path = "src/request_reporter/assets/*", format = ["sdist", "wheel"]}]

[tool.poetry.group.dev.dependencies]
robotframework-requests = "0.9.7"
robotframework-datadriver = "1.11.2"
ruff = ">=0.12,<1"
mypy = ">=1.15,<2"
types-requests = "*"
twine = ">=6,<7"
robotframework-robocop = "^9.1.0"

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.6,<10"
markdown = ">=3.7,<4"
pygments = ">=2.19,<3"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.robocop]
target-version = 7

[tool.robocop.lint]
threshold = "E"

[tool.robocop.format]
